{% extends "base.html" %}
{% block title %}Takım Başvurusu | ŞCSAL E-Spor{% endblock %}
{% block content %}
<section class="page-intro"><p class="kicker">TAKIM KAYDI</p><h1>Turnuvaya katıl<span>.</span></h1><p>Formu takım kaptanı doldursun. Başvurun yönetici onayından sonra yayımlanır.</p></section>
<form class="form-panel" method="post">
<div class="form-grid">
<label>Sınıf / takım adı *<input name="class_name" required maxlength="80" placeholder="Örn. 10/A"></label>
<label>Kaptan adı *<input name="captain" required maxlength="100"></label>
<label>İletişim bilgisi *<input name="contact" required maxlength="120" placeholder="Discord kullanıcı adı"></label>
<label>Yedek oyuncu *<input name="substitute" required maxlength="100"></label>
{% for i in range(1,6) %}<label>Oyuncu {{ i }} *<input name="player{{ i }}" required maxlength="100"></label>{% endfor %}
<label class="full">Not (isteğe bağlı)<textarea name="note" rows="3" maxlength="500"></textarea></label>
</div><button class="btn" type="submit">Başvuruyu gönder ↗</button>
</form>
{% endblock %}
